services:
  - type: web
    name: costiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker keeps pandas within the free plan's 512 MB (each run writes to its own
    # uploads/<run_id>/ folder, so more workers are safe on a bigger instance).
    # Long timeout: /run-analysis runs the full LangGraph pipeline in-request.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 900 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
