services:
  - type: web
    name: costiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker: DataUnifier writes unified_dataset.csv to the working dir,
    # so concurrent runs in separate workers would overwrite each other.
    # Long timeout: /run-analysis runs the full LangGraph pipeline in-request.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 900 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
